[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loadslack"
version = "0.3.0"
description = "Sidechain compressor for AI compute: duck token flows against grid stress, with auditable curtailment receipts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Raymond Mally" }]
keywords = [
    "curtailment", "demand-response", "large-load", "load-flexibility",
    "grid", "carbon-aware", "llm", "inference", "tariff", "compliance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
loadslack = "loadslack.cli:main"

[project.urls]
Homepage = "https://github.com/rayj3088/loadslack"
Issues = "https://github.com/rayj3088/loadslack/issues"

[tool.setuptools.packages.find]
include = ["loadslack*"]
